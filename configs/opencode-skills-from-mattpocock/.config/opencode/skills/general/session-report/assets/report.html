<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  color-scheme: light;
  --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --border:#d1d9e0;
  --accent:#0969da; --code-bg:#f6f8fa; --sidebar-bg:#f6f8fa; --mark:#fff8c5;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --border:#30363d;
  --accent:#4493f8; --code-bg:#161b22; --sidebar-bg:#010409; --mark:#3a2e00;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.layout{display:flex;min-height:100vh}
nav.toc{position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto;
  width:300px;flex:0 0 300px;padding:24px 18px 48px;border-right:1px solid var(--border);
  background:var(--sidebar-bg);font-size:14px}
nav.toc h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  margin:0 0 12px;font-weight:600}
nav.toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 8px;border-radius:6px;
  line-height:1.35;border-left:2px solid transparent}
nav.toc a:hover{color:var(--fg);background:rgba(127,127,127,.12)}
nav.toc a.lvl-1{font-weight:600;color:var(--fg);margin-top:6px}
nav.toc a.lvl-3{padding-left:22px;font-size:12.5px}
nav.toc a.active{color:var(--accent);border-left-color:var(--accent);background:rgba(127,127,127,.10)}
main{flex:1;min-width:0;padding:48px 64px 96px;max-width:900px;margin:0 auto}
.toolbar{position:fixed;top:14px;right:18px;z-index:20;display:flex;gap:8px}
.toolbar button{font:13px/1 inherit;color:var(--fg);background:var(--code-bg);
  border:1px solid var(--border);border-radius:999px;padding:8px 12px;cursor:pointer}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
#content{max-width:100%}
#content h1{font-size:2rem;line-height:1.2;margin:.2em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
#content h2{font-size:1.45rem;margin:2em 0 .6em;padding-bottom:.25em;border-bottom:1px solid var(--border)}
#content h3{font-size:1.15rem;margin:1.6em 0 .5em}
#content a{color:var(--accent)}
#content p{margin:.7em 0}
#content ul,#content ol{padding-left:1.6em;margin:.6em 0}
#content li{margin:.25em 0}
#content blockquote{margin:1em 0;padding:.4em 1em;color:var(--muted);border-left:3px solid var(--border)}
#content code{background:var(--code-bg);padding:.15em .35em;border-radius:5px;
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:.9em}
#content pre{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;overflow:auto;margin:0;font-size:13.5px;line-height:1.55}
#content pre code{background:none;padding:0;font-size:inherit}
.code-block{position:relative;margin:1em 0}
.code-block .src{display:block;font:11.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--muted);margin:0 2px 6px}
.code-block .copy-btn{position:absolute;top:8px;right:8px;font:12px/1 inherit;
  color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:5px 9px;cursor:pointer;opacity:0;transition:opacity .12s}
.code-block:hover .copy-btn{opacity:1}
.code-block .copy-btn:hover{border-color:var(--accent);color:var(--accent)}
#content table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.92em;
  display:block;overflow:auto}
#content th,#content td{border:1px solid var(--border);padding:7px 12px;text-align:left}
#content th{background:var(--sidebar-bg);font-weight:600}
#content img{max-width:100%}
#content hr{border:0;border-top:1px solid var(--border);margin:2.2em 0}
#content .mermaid{display:flex;justify-content:center;margin:1.4em 0;overflow:auto}
#content mark{background:var(--mark)}
.mermaid-err{color:var(--muted);font-size:13px;font-style:italic}
.layout,.toc{transition:none}
@media (max-width:920px){
  .layout{display:block}
  nav.toc{position:static;height:auto;width:auto;flex:none;border-right:0;
    border-bottom:1px solid var(--border)}
  main{padding:32px 20px 64px}
}
@media print{
  .toolbar,nav.toc,.copy-btn{display:none!important}
  main{max-width:none;padding:0}
  #content pre{white-space:pre-wrap;word-break:break-word}
}
</style>
<style id="hljs-light">
__HLJS_LIGHT__
</style>
<style id="hljs-dark" media="not all">
__HLJS_DARK__
</style>
</head>
<body>
<div class="toolbar">
  <button id="theme-btn" type="button" aria-label="Toggle theme"></button>
</div>
<div class="layout">
  <nav class="toc" aria-label="Table of contents">
    <h2 id="toc-title">On this page</h2>
    <div id="toc-list"></div>
  </nav>
  <main>
    <article id="content"></article>
  </main>
</div>
<script id="source" type="text/plain">__SOURCE__</script>
<script>__MARKED__</script>
<script>__HIGHLIGHT__</script>
<script>__MERMAID__</script>
<script>
(function(){
  "use strict";
  var I18N = {
    en:{toc:"On this page",copy:"Copy",copied:"Copied",dark:"Dark",light:"Light"},
    es:{toc:"En esta página",copy:"Copiar",copied:"Copiado",dark:"Oscuro",light:"Claro"},
    ca:{toc:"En aquesta pàgina",copy:"Copia",copied:"Copiat",dark:"Fosc",light:"Clar"},
    fr:{toc:"Sur cette page",copy:"Copier",copied:"Copié",dark:"Sombre",light:"Clair"},
    pt:{toc:"Nesta página",copy:"Copiar",copied:"Copiado",dark:"Escuro",light:"Claro"},
    de:{toc:"Auf dieser Seite",copy:"Kopieren",copied:"Kopiert",dark:"Dunkel",light:"Hell"},
    it:{toc:"In questa pagina",copy:"Copia",copied:"Copiato",dark:"Scuro",light:"Chiaro"}
  };
  var lang = (document.documentElement.lang || "en").slice(0,2).toLowerCase();
  var t = I18N[lang] || I18N.en;

  var raw = document.getElementById("source").textContent.trim();
  var md = new TextDecoder().decode(Uint8Array.from(atob(raw), function(c){return c.charCodeAt(0);}));
  var content = document.getElementById("content");
  var tocList = document.getElementById("toc-list");

  function escHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;");
  }
  // Keep the `file=path:line` part of a fence info string as a caption on the block.
  var renderer = new marked.Renderer();
  renderer.code = function(token){
    var info = token.lang || "";
    var langMatch = info.match(/\S+/);
    var src = info.match(/\bfile=(\S+)/);
    var cls = langMatch ? ' class="language-' + escHtml(langMatch[0]) + '"' : "";
    var attr = src ? ' data-src="' + escHtml(src[1]) + '"' : "";
    var body = token.escaped ? token.text : escHtml(token.text);
    return "<pre><code" + cls + attr + ">" + body + "</code></pre>\n";
  };
  marked.use({renderer: renderer});

  function slug(s){
    return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "section";
  }
  function buildTOC(){
    tocList.innerHTML = "";
    var seen = {};
    content.querySelectorAll("h1,h2,h3").forEach(function(h){
      var base = slug(h.textContent), id = base, n = 2;
      while(seen[id]){ id = base + "-" + n++; }
      seen[id] = true; h.id = id;
      var a = document.createElement("a");
      a.href = "#" + id; a.textContent = h.textContent;
      a.className = h.tagName === "H1" ? "lvl-1" : h.tagName === "H2" ? "lvl-2" : "lvl-3";
      tocList.appendChild(a);
    });
  }
  function transformMermaid(){
    content.querySelectorAll("pre > code.language-mermaid").forEach(function(code){
      var div = document.createElement("div");
      div.className = "mermaid"; div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
  }
  function addCopyButtons(){
    content.querySelectorAll("pre").forEach(function(pre){
      var wrap = document.createElement("div"); wrap.className = "code-block";
      var code = pre.querySelector("code");
      if(code && code.dataset.src){
        var src = document.createElement("span");
        src.className = "src"; src.textContent = code.dataset.src;
        wrap.appendChild(src);
      }
      pre.replaceWith(wrap); wrap.appendChild(pre);
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "copy-btn"; btn.textContent = t.copy;
      btn.addEventListener("click", function(){
        navigator.clipboard.writeText(pre.innerText).then(function(){
          btn.textContent = t.copied;
          setTimeout(function(){ btn.textContent = t.copy; }, 1400);
        });
      });
      wrap.appendChild(btn);
    });
  }
  function renderMermaid(){
    if(!window.mermaid){ return; }
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    try{
      mermaid.initialize({startOnLoad:false, securityLevel:"loose", theme: dark ? "dark" : "default"});
      mermaid.run({querySelector:".mermaid"}).catch(function(e){
        console.error("mermaid", e);
        content.querySelectorAll(".mermaid").forEach(function(d){
          if(!d.querySelector("svg")) d.classList.add("mermaid-err");
        });
      });
    }catch(e){ console.error("mermaid", e); }
  }
  function render(){
    content.innerHTML = marked.parse(md, {gfm:true, breaks:false});
    buildTOC();
    transformMermaid();
    content.querySelectorAll("pre code:not(.language-mermaid)").forEach(function(el){
      try{ hljs.highlightElement(el); }catch(e){}
    });
    addCopyButtons();
    renderMermaid();
  }

  // theme
  var themeBtn = document.getElementById("theme-btn");
  function applyTheme(dark){
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    document.getElementById("hljs-dark").media = dark ? "all" : "not all";
    document.getElementById("hljs-light").media = dark ? "not all" : "all";
    themeBtn.textContent = dark ? t.light : t.dark;
  }
  var stored = localStorage.getItem("report-theme");
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(stored ? stored === "dark" : prefersDark);
  themeBtn.addEventListener("click", function(){
    var dark = document.documentElement.getAttribute("data-theme") !== "dark";
    applyTheme(dark);
    localStorage.setItem("report-theme", dark ? "dark" : "light");
    render(); // re-render mermaid with the matching theme
    window.scrollTo(0, window.scrollY);
  });

  document.getElementById("toc-title").textContent = t.toc;
  render();

  // scrollspy
  if("IntersectionObserver" in window){
    var links = {};
    tocList.querySelectorAll("a").forEach(function(a){ links[a.getAttribute("href").slice(1)] = a; });
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          Object.values(links).forEach(function(a){ a.classList.remove("active"); });
          if(links[en.target.id]) links[en.target.id].classList.add("active");
        }
      });
    }, {rootMargin:"0px 0px -75% 0px", threshold:0});
    content.querySelectorAll("h1,h2,h3").forEach(function(h){ obs.observe(h); });
  }
})();
</script>
</body>
</html>
